name: Test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy

      - name: Rust formatting
        run: cargo +1.96.0 fmt --manifest-path atomis-rs/Cargo.toml --all -- --check

      - name: Rust checks and tests
        run: |
          cargo +1.96.0 check --manifest-path atomis-rs/Cargo.toml --all-targets --locked
          cargo +1.96.0 test --manifest-path atomis-rs/Cargo.toml --all-targets --locked
          cargo +1.96.0 clippy --manifest-path atomis-rs/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
